<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Training Log</title>
<meta name="theme-color" content="#12151a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Training Log" />
<link rel="manifest" href="manifest.json" />

<style>
:root {
  --bg: #12151a; --surface: #1b2028; --surface2: #232a33; --line: #2c3440;
  --text: #ecebe4; --muted: #8b95a3; --accent: #ff5330; --accent2: #f2b93c;
  --water: #4fb8c9; --good: #5fbf82;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body {
  background-image:
    linear-gradient(rgba(255,83,48,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,83,48,0.035) 1px, transparent 1px);
  background-size: 28px 28px;
  background-attachment: fixed;
}
@keyframes fadeSlideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.tab-pane { animation: fadeSlideUp 0.35s cubic-bezier(0.16,1,0.3,1); }
.tab-pane .card, .tab-pane .schedule-card, .tab-pane .guide-item { animation: fadeIn 0.5s ease both; }
.tab-pane .row, .tab-pane .program-item, .tab-pane .chore-row { animation: fadeSlideUp 0.4s cubic-bezier(0.16,1,0.3,1) both; }
.tab-pane .row:nth-child(1), .tab-pane .program-item:nth-child(1), .tab-pane .chore-row:nth-child(1) { animation-delay: 0.02s; }
.tab-pane .row:nth-child(2), .tab-pane .program-item:nth-child(2), .tab-pane .chore-row:nth-child(2) { animation-delay: 0.06s; }
.tab-pane .row:nth-child(3), .tab-pane .program-item:nth-child(3), .tab-pane .chore-row:nth-child(3) { animation-delay: 0.10s; }
.tab-pane .row:nth-child(4), .tab-pane .program-item:nth-child(4), .tab-pane .chore-row:nth-child(4) { animation-delay: 0.14s; }
.tab-pane .row:nth-child(5), .tab-pane .program-item:nth-child(5), .tab-pane .chore-row:nth-child(5) { animation-delay: 0.18s; }
.tab-pane .row:nth-child(n+6), .tab-pane .program-item:nth-child(n+6), .tab-pane .chore-row:nth-child(n+6) { animation-delay: 0.22s; }
input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

.header { padding: 18px 18px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
.header-top { display: flex; align-items: center; justify-content: space-between; }
.brand { font-size: 19px; font-weight: 800; letter-spacing: 0.06em; display: flex; align-items: center; gap: 6px; }
.brand-mark { color: var(--accent); font-size: 12px; }
.date-nav { display: flex; align-items: center; gap: 0; background: linear-gradient(180deg, rgba(255,83,48,0.08), rgba(255,83,48,0.02)); border: 1px solid rgba(255,83,48,0.35); border-radius: 10px; padding: 4px; position: relative; overflow: hidden; }
.date-nav::before { content: ""; position: absolute; top: 0; left: -40%; width: 30%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,83,48,0.15), transparent); animation: scan 3.5s ease-in-out infinite; }
@keyframes scan { 0% { left: -40%; } 100% { left: 110%; } }
.date-nav button.arrow { background: rgba(255,83,48,0.08); border: 1px solid transparent; color: var(--accent); font-size: 18px; width: 28px; height: 28px; border-radius: 7px; position: relative; z-index: 1; transition: background 0.15s, transform 0.1s; display: flex; align-items: center; justify-content: center; }
.date-nav button.arrow:active { transform: scale(0.88); background: rgba(255,83,48,0.25); }
.date-nav button.label { position: relative; z-index: 1; background: none; border: none; color: var(--accent); font-size: 11.5px; letter-spacing: 0.12em; font-family: 'Courier New', monospace; font-weight: 700; padding: 4px 10px; text-shadow: 0 0 8px rgba(255,83,48,0.55); }
.date-nav button.label::before { content: "["; opacity: 0.5; margin-right: 3px; }
.date-nav button.label::after { content: "]"; opacity: 0.5; margin-left: 3px; }
.live-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--good); margin-right: 6px; box-shadow: 0 0 6px var(--good); animation: pulse-dot 1.6s ease-in-out infinite; }
@keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.7); } }
.header-sub { margin-top: 6px; font-size: 12px; color: var(--muted); }
.live-clock { margin-top: 8px; font-family: 'Courier New', monospace; font-size: 12px; letter-spacing: 0.04em; color: var(--water); text-shadow: 0 0 8px rgba(79,184,201,0.5); display: inline-block; }

.content { flex: 1; padding: 16px 16px 104px; overflow-y: auto; }
.tab-pane { display: flex; flex-direction: column; gap: 8px; }

.section-label { display: flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 14px; margin-bottom: 2px; }

.card { background: linear-gradient(160deg, var(--surface), rgba(27,32,40,0.7)); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 8px 20px -12px rgba(0,0,0,0.6); position: relative; transition: border-color 0.2s, box-shadow 0.2s; }
.card:active { border-color: rgba(255,83,48,0.4); }
.card-row { display: flex; gap: 10px; }

.stat-block { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.stat-label { font-size: 10px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
.stat-value { font-size: 24px; font-weight: 800; transition: text-shadow 0.3s; }
.stat-value.accent { color: var(--accent); text-shadow: 0 0 14px rgba(255,83,48,0.5); }
.stat-sub { font-size: 11px; color: var(--muted); }

.plain-list { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--surface2); border-radius: 10px; }
.row-name { flex: 1; font-size: 13.5px; font-weight: 500; }
.row-date { font-size: 10px; color: var(--muted); font-family: monospace; width: 32px; }
.mono { font-family: monospace; font-size: 12.5px; color: var(--accent2); }
.icon-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; font-size: 15px; }

.empty-state { font-size: 13px; color: var(--muted); padding: 10px 2px; }

.field-group { display: flex; flex-direction: column; gap: 5px; }
.field-label { font-size: 10.5px; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; }
.text-input, .note-input {
  background: var(--surface2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px;
  color: var(--text); font-size: 14px; outline: none; width: 100%; font-family: inherit;
}
.num-field { flex: 1; display: flex; flex-direction: column; gap: 5px; }
.num-input { background: var(--surface2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 8px; color: var(--text); font-size: 14px; font-family: monospace; outline: none; width: 100%; text-align: center; }

.primary-btn { background: linear-gradient(135deg, var(--accent), #ff7a4d); border: none; border-radius: 10px; color: #1a0d08; font-weight: 800; font-size: 14px; padding: 11px 14px; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; width: 100%; position: relative; overflow: hidden; box-shadow: 0 4px 16px -4px rgba(255,83,48,0.5); transition: transform 0.1s; }
.primary-btn::after { content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(115deg, transparent, rgba(255,255,255,0.35), transparent); transform: skewX(-20deg); animation: btn-shine 2.8s ease-in-out infinite; }
@keyframes btn-shine { 0% { left: -60%; } 40%, 100% { left: 130%; } }
.primary-btn:active { transform: scale(0.97); }
.log-btn { background: linear-gradient(135deg, var(--accent), #ff7a4d); border: none; border-radius: 9px; color: #1a0d08; font-weight: 800; font-size: 13px; padding: 9px 14px; cursor: pointer; white-space: nowrap; box-shadow: 0 3px 12px -3px rgba(255,83,48,0.5); transition: transform 0.1s; }
.log-btn:active { transform: scale(0.94); }
.ghost-btn { background: none; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: 12.5px; padding: 10px 12px; cursor: pointer; margin-top: 6px; width: 100%; transition: border-color 0.2s, color 0.2s; }
.ghost-btn:active { border-color: var(--accent); color: var(--accent2); }

.schedule-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.schedule-top { display: flex; align-items: center; gap: 14px; }
.schedule-day { font-size: 15px; font-weight: 700; letter-spacing: 0.03em; flex: 1; }
.toggle-label { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
.toggle-label input { width: 15px; height: 15px; accent-color: var(--accent); }

.plate-wrap { position: relative; width: 140px; height: 140px; align-self: center; }
.plate-wrap svg circle:nth-child(2) { filter: drop-shadow(0 0 6px var(--water)); }
.plate-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.plate-value { font-size: 30px; font-weight: 800; text-shadow: 0 0 16px rgba(79,184,201,0.6); }
.plate-goal { font-size: 11px; color: var(--muted); margin-top: 2px; }
.quick-add-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.quick-add-btn { background: linear-gradient(135deg, var(--water), #3a8fa0); border: none; border-radius: 9px; color: #062229; font-weight: 800; font-size: 12.5px; padding: 9px 12px; cursor: pointer; box-shadow: 0 3px 12px -3px rgba(79,184,201,0.5); transition: transform 0.1s; }
.quick-add-btn:active { transform: scale(0.93); }
.quick-add-ghost { background: none; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); font-size: 12.5px; padding: 9px 12px; cursor: pointer; }

.creatine-btn { display: flex; align-items: center; gap: 10px; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; color: var(--text); font-size: 14px; font-weight: 500; cursor: pointer; width: 100%; transition: transform 0.15s, background 0.2s, border-color 0.2s; }
.creatine-btn.active { background: rgba(95,191,130,0.14); border-color: var(--good); color: var(--good); box-shadow: 0 0 20px -6px rgba(95,191,130,0.5); animation: pop 0.3s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.03); } 100% { transform: scale(1); } }
.creatine-check { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid currentColor; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px; }
.hint { font-size: 11.5px; color: var(--muted); margin-top: 8px; }

.chore-row { display: flex; align-items: center; gap: 8px; }
.chore-check-btn { flex: 1; display: flex; align-items: center; gap: 10px; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; text-align: left; transition: border-color 0.2s; }
.chore-checkbox { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--muted); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11px; transition: transform 0.2s, background 0.2s; }
.chore-checkbox.done { background: var(--good); border-color: var(--good); color: #0a1a10; box-shadow: 0 0 10px -1px rgba(95,191,130,0.7); animation: pop 0.3s cubic-bezier(0.34,1.56,0.64,1); }
.chore-text.done { color: var(--muted); text-decoration: line-through; }
.add-chore-row { display: flex; gap: 8px; margin-top: 4px; }
.icon-add-btn { background: var(--accent); border: none; color: #1a0d08; cursor: pointer; border-radius: 10px; width: 40px; font-size: 18px; }

.program-header { display: flex; justify-content: center; margin-top: 4px; }
.program-badge { font-size: 13px; font-weight: 800; letter-spacing: 0.05em; padding: 8px 16px; border-radius: 999px; text-transform: uppercase; position: relative; overflow: hidden; animation: fadeIn 0.4s ease; }
.badge-upper { background: rgba(79,184,201,0.15); color: var(--water); border: 1px solid var(--water); box-shadow: 0 0 18px -4px rgba(79,184,201,0.5); }
.badge-lower { background: rgba(95,191,130,0.15); color: var(--good); border: 1px solid var(--good); box-shadow: 0 0 18px -4px rgba(95,191,130,0.5); }
.badge-rest { background: rgba(139,149,163,0.15); color: var(--muted); border: 1px solid var(--muted); }
.badge-optional { background: rgba(242,185,60,0.15); color: var(--accent2); border: 1px solid var(--accent2); box-shadow: 0 0 18px -4px rgba(242,185,60,0.5); }
.program-card { gap: 10px; }
.program-item { background: var(--surface2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.program-item.done { opacity: 0.6; }
.program-item-top { display: flex; justify-content: space-between; align-items: center; }
.program-item-name { font-size: 14px; font-weight: 700; }
.program-item-target { font-size: 12px; color: var(--muted); font-family: monospace; }
.program-item-inputs { display: flex; gap: 8px; align-items: flex-end; }
.log-btn { background: var(--accent); border: none; border-radius: 9px; color: #1a0d08; font-weight: 700; font-size: 13px; padding: 9px 14px; cursor: pointer; white-space: nowrap; }

.guide-wrap { gap: 16px; }
.guide-group-title { font-size: 12px; font-weight: 800; letter-spacing: 0.05em; color: var(--accent2); text-transform: uppercase; margin-bottom: 8px; }
.guide-group + .guide-group { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.guide-item { background: var(--surface2); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.guide-name { font-size: 13.5px; font-weight: 700; margin-bottom: 4px; }
.guide-row { font-size: 12px; color: var(--muted); line-height: 1.5; }
.guide-label { color: var(--text); font-weight: 600; }
.guide-link { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 12px; color: var(--water); text-decoration: none; font-weight: 600; }

.sleep-row { display: flex; gap: 8px; flex-wrap: wrap; }
.sleep-chip { background: var(--surface2); border: 1px solid var(--line); border-radius: 9px; color: var(--text); font-size: 13px; font-family: monospace; padding: 9px 14px; cursor: pointer; }
.sleep-chip.active { background: var(--accent2); border-color: var(--accent2); color: #241a04; font-weight: 700; }

.bottom-nav { position: sticky; bottom: 0; padding: 10px 12px 16px; background: linear-gradient(180deg, transparent, var(--bg) 30%); }
.nav-dock {
  display: flex; justify-content: space-around; align-items: center;
  background: linear-gradient(160deg, rgba(35,42,51,0.9), rgba(27,32,40,0.85));
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 20px; padding: 8px 6px;
  box-shadow: 0 -1px 0 rgba(255,255,255,0.04) inset, 0 12px 30px -10px rgba(0,0,0,0.65);
}
.nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 7px 10px; color: var(--muted); position: relative; transition: color 0.25s, transform 0.15s; border-radius: 12px; flex: 1; }
.nav-btn:active { transform: scale(0.92); }
.nav-btn.active { color: var(--accent); background: rgba(255,83,48,0.1); }
.nav-btn.active::before { content: ""; position: absolute; top: 1px; left: 50%; transform: translateX(-50%); width: 16px; height: 2.5px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 8px 1px rgba(255,83,48,0.8); }
.nav-icon { width: 20px; height: 20px; display: flex; transition: filter 0.25s, transform 0.2s; }
.nav-icon svg { width: 100%; height: 100%; }
.nav-btn.active .nav-icon { filter: drop-shadow(0 0 5px rgba(255,83,48,0.65)); transform: translateY(-1px); }
.nav-label { font-size: 9.5px; letter-spacing: 0.02em; font-weight: 600; }

input, textarea, button { font-family: inherit; }
</style>
</head>

  var WEEK_PROGRAM = [
    { day: "rest", program: FOREARM_DAY },   // Sunday
    { day: "upper", program: UPPER_DAY },    // Monday
    { day: "rest", program: FOREARM_DAY },   // Tuesday
    { day: "lower", program: LOWER_DAY },    // Wednesday
    { day: "upper", program: UPPER_DAY },    // Thursday
    { day: "lower", program: LOWER_DAY },    // Friday
    { day: "optional", program: FOREARM_DAY }, // Saturday
  ];
  var MIN_KG = 10;

  function getProgress() { return get("exercise-progress", {}); }
  function saveProgress(name, kg, reps) {
    var p = getProgress();
    p[name] = { kg: kg, reps: reps };
    set("exercise-progress", p);
  }

  function todayKey(d) {
    d = d || new Date();
    return d.toISOString().slice(0, 10);
  }
  function dateLabel(key) {
    var d = new Date(key + "T00:00:00");
    return DAY_LABELS[d.getDay()] + " · " + (d.getMonth() + 1) + "/" + d.getDate();
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function get(key, fallback) {
    try {
      var v = localStorage.getItem(key);
      return v ? JSON.parse(v) : fallback;
    } catch (e) { return fallback; }
  }
  function set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.error(e); }
  }
  function emptyDay() {
    return { waterMl: 0, creatineTaken: false, meals: [], chores: [], sleepHours: null };
  }
  function defaultSchedule() {
    var arr = [];
    for (var i = 0; i < 7; i++) {
      var isWeekday = i >= 1 && i <= 5;
      arr.push({ hasClass: isWeekday, gym: isWeekday, note: isWeekday ? "Gym after class, evening" : "Rest / flexible" });
    }
    return arr;
  }

  var state = {
    tab: "today",
    guideOpen: false,
    dayKey: todayKey(),
    schedule: get("weekly-schedule", null) || defaultSchedule(),
    exercises: get("exercise-list", []),
    workoutLog: get("workout-log", []),
    dayLog: null,
  };
  state.dayLog = get("daily-log:" + state.dayKey, null) || emptyDay();

  function saveDayLog(next) {
    state.dayLog = next;
    set("daily-log:" + state.dayKey, next);
    render();
  }
  function saveSchedule(next) {
    state.schedule = next;
    set("weekly-schedule", next);
    render();
  }
  function saveWorkoutLog(next) {
    state.workoutLog = next;
    set("workout-log", next);
    render();
  }
  function saveExercises(next) {
    state.exercises = next;
    set("exercise-list", next);
  }
  function goToDay(key) {
    state.dayKey = key;
    state.dayLog = get("daily-log:" + key, null) || emptyDay();
    render();
  }
  function setTab(t) { state.tab = t; render(); }

  function headerHtml() {
    var d = new Date(state.dayKey + "T00:00:00");
    var idx = d.getDay();
    var sched = state.schedule[idx];
    var isToday = state.dayKey === todayKey();
    var sub = sched ? ((sched.hasClass ? "Class day" : "No class") + " · " + (sched.gym ? "Gym: " + esc(sched.note || "yes") : "No gym scheduled")) : "";
    return (
      '<div class="header">' +
        '<div class="header-top">' +
          '<div class="brand"><span class="brand-mark">&#9670;</span> TRAINING LOG</div>' +
          '<div class="date-nav">' +
            '<button class="arrow" data-action="prevday">&#8249;</button>' +
            '<button class="label" data-action="gotoday" style="opacity:' + (isToday ? 1 : 0.65) + '">' + (isToday ? '<span class="live-dot"></span>' : '') + dateLabel(state.dayKey) + '</button>' +
            '<button class="arrow" data-action="nextday">&#8250;</button>' +
          '</div>' +
        '</div>' +
        (sub ? '<div class="header-sub">' + sub + '</div>' : '') +
        '<div class="live-clock" id="live-clock"></div>' +
      '</div>'
    );
  }

  function formatClock(d) {
    var days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var h = d.getHours();
    var ampm = h >= 12 ? "PM" : "AM";
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    var mm = String(d.getMinutes()).padStart(2, "0");
    var ss = String(d.getSeconds()).padStart(2, "0");
    return days[d.getDay()] + ", " + months[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear() + " &middot; " + h12 + ":" + mm + ":" + ss + " " + ampm;
  }

  function tickClock() {
    var el = document.getElementById("live-clock");
    if (el) el.innerHTML = formatClock(new Date());
  }
  setInterval(tickClock, 1000);

  function statBlock(label, value, sub, accent) {
    return (
      '<div class="stat-block">' +
        '<div class="stat-label">' + esc(label) + '</div>' +
        '<div class="stat-value' + (accent ? ' accent' : '') + '">' + esc(value) + '</div>' +
        '<div class="stat-sub">' + esc(sub) + '</div>' +
      '</div>'
    );
  }

  function todayTabHtml() {
    var todaysSets = state.workoutLog.filter(function (w) { return w.date === state.dayKey; });
    var proteinTotal = state.dayLog.meals.reduce(function (s, m) { return s + (Number(m.protein) || 0); }, 0);
    var waterPct = Math.min(100, Math.round((state.dayLog.waterMl / WATER_GOAL_ML) * 100));
    var idx = new Date(state.dayKey + "T00:00:00").getDay();
    var sched = state.schedule[idx];
    var dayProgram = WEEK_PROGRAM[idx];

    var workoutRows = todaysSets.length === 0
      ? '<div class="empty-state">No sets logged yet today (' + dayProgram.program.label + ' day). Go to Workout to log one.</div>'
      : '<div class="plain-list">' + todaysSets.map(function (w) {
          return '<div class="row"><span class="row-name">' + esc(w.exercise) + '</span><span class="mono">' + w.sets + '&times;' + w.reps + ' @ ' + w.weight + 'kg</span></div>';
        }).join("") + '</div>';

    return (
      '<div class="tab-pane">' +
        '<div class="section-label">&#128197; Today</div>' +
        '<div class="card"><div class="card-row">' +
          statBlock("Water", (state.dayLog.waterMl / 1000).toFixed(1) + "L", waterPct + "% of goal") +
          statBlock("Creatine", state.dayLog.creatineTaken ? "Taken" : "Not yet", state.dayLog.creatineTaken ? "✓ logged" : "—", state.dayLog.creatineTaken) +
          statBlock("Protein", proteinTotal + "g", state.dayLog.meals.length + " meal" + (state.dayLog.meals.length === 1 ? "" : "s")) +
        '</div></div>' +
        '<div class="section-label">&#127939; Workout</div>' +
        '<div class="card">' + workoutRows + '</div>' +
        '<div class="section-label">&#127769; Recovery</div>' +
        '<div class="card"><div class="card-row">' +
          statBlock("Sleep", state.dayLog.sleepHours != null ? state.dayLog.sleepHours + "h" : "—", "last night") +
          statBlock("Chores", state.dayLog.chores.filter(function (c) { return c.done; }).length + "/" + state.dayLog.chores.length, "done today") +
        '</div></div>' +
      '</div>'
    );
  }

  function scheduleTabHtml() {
    var rows = state.schedule.map(function (s, i) {
      return (
        '<div class="schedule-card">' +
          '<div class="schedule-top">' +
            '<span class="schedule-day">' + DAY_LABELS[i] + '</span>' +
            '<label class="toggle-label"><input type="checkbox" data-sched-idx="' + i + '" data-sched-field="hasClass" ' + (s.hasClass ? "checked" : "") + '/> Class</label>' +
            '<label class="toggle-label"><input type="checkbox" data-sched-idx="' + i + '" data-sched-field="gym" ' + (s.gym ? "checked" : "") + '/> Gym</label>' +
          '</div>' +
          '<input class="note-input" data-sched-idx="' + i + '" data-sched-field="note" value="' + esc(s.note) + '" placeholder="Note (e.g. after class, evening)" />' +
        '</div>'
      );
    }).join("");
    return '<div class="tab-pane"><div class="section-label">&#128197; Weekly Schedule</div><div class="plain-list">' + rows + '</div></div>';
  }

  function workoutTabHtml() {
    var todaysSets = state.workoutLog.filter(function (w) { return w.date === state.dayKey; });
    var history = state.workoutLog.filter(function (w) { return w.date !== state.dayKey; }).slice(0, 40);
    var idx = new Date(state.dayKey + "T00:00:00").getDay();
    var dayProgram = WEEK_PROGRAM[idx];
    var prog = dayProgram.program;
    var progress = getProgress();

    var loggedNames = {};
    todaysSets.forEach(function (w) { loggedNames[w.exercise] = true; });

    var badgeClass = dayProgram.day === "upper" ? "badge-upper" : dayProgram.day === "lower" ? "badge-lower" : dayProgram.day === "optional" ? "badge-optional" : "badge-rest";

    var exerciseRows = prog.exercises.map(function (ex) {
      var saved = progress[ex.name] || {};
      var defaultKg = saved.kg != null ? saved.kg : MIN_KG;
      var defaultReps = saved.reps != null ? saved.reps : ex.repsMin;
      var done = !!loggedNames[ex.name];
      var idAttr = ex.name.replace(/[^a-zA-Z0-9]/g, "-");
      return (
        '<div class="program-item' + (done ? ' done' : '') + '">' +
          '<div class="program-item-top">' +
            '<span class="program-item-name">' + esc(ex.name) + (done ? ' &#9989;' : '') + '</span>' +
            '<span class="program-item-target">' + ex.sets + ' &times; ' + ex.repsMin + '-' + ex.repsMax + '</span>' +
          '</div>' +
          '<div class="program-item-inputs">' +
            '<div class="num-field"><span class="field-label">Reps</span><input class="num-input" id="reps-' + idAttr + '" type="number" min="1" value="' + defaultReps + '" /></div>' +
            '<div class="num-field"><span class="field-label">Kg (min 10)</span><input class="num-input" id="kg-' + idAttr + '" type="number" min="' + MIN_KG + '" step="0.5" value="' + defaultKg + '" /></div>' +
            '<button class="log-btn" data-action="logprogram" data-name="' + esc(ex.name) + '" data-sets="' + ex.sets + '" data-repsid="reps-' + idAttr + '" data-kgid="kg-' + idAttr + '">Log</button>' +
          '</div>' +
        '</div>'
      );
    }).join("");

    var todayRows = todaysSets.length === 0
      ? '<div class="empty-state">Nothing logged yet — log your first exercise below.</div>'
      : '<div class="plain-list">' + todaysSets.map(function (w) {
          return '<div class="row"><span class="row-name">' + esc(w.exercise) + '</span><span class="mono">' + w.sets + '&times;' + w.reps + ' @ ' + w.weight + 'kg</span><button class="icon-btn" data-action="delworkout" data-id="' + w.id + '">&#10005;</button></div>';
        }).join("") + '</div>';

    var historyRows = history.length === 0 ? "" : (
      '<div class="section-label">&#128197; History</div><div class="card"><div class="plain-list">' +
      history.map(function (w) {
        return '<div class="row"><span class="row-date">' + w.date.slice(5) + '</span><span class="row-name">' + esc(w.exercise) + '</span><span class="mono">' + w.sets + '&times;' + w.reps + ' @ ' + w.weight + 'kg</span><button class="icon-btn" data-action="delworkout" data-id="' + w.id + '">&#10005;</button></div>';
      }).join("") + '</div></div>'
    );

    return (
      '<div class="tab-pane">' +
        '<div class="program-header">' +
          '<span class="program-badge ' + badgeClass + '">' + prog.emoji + ' ' + prog.label + '</span>' +
        '</div>' +
        '<div class="card program-card">' + exerciseRows + '</div>' +
        '<div class="section-label">&#128293; Logged Today · ' + todaysSets.length + ' set' + (todaysSets.length === 1 ? "" : "s") + '</div>' +
        '<div class="card">' + todayRows + '</div>' +
        historyRows +
        exerciseGuideHtml() +
      '</div>'
    );
  }

  function exerciseGuideHtml() {
    var toggleLabel = state.guideOpen ? "Hide exercise guide" : "&#128218; Exercise Guide — machine, alternative, form video";
    var body = "";
    if (state.guideOpen) {
      body = EXERCISE_GUIDE.map(function (group) {
        var rows = group.items.map(function (ex) {
          return (
            '<div class="guide-item">' +
              '<div class="guide-name">' + esc(ex.name) + '</div>' +
              '<div class="guide-row"><span class="guide-label">Machine:</span> ' + esc(ex.machine) + '</div>' +
              '<div class="guide-row"><span class="guide-label">No machine? Try:</span> ' + esc(ex.alt) + '</div>' +
              '<a class="guide-link" href="' + ytSearchUrl(ex.name) + '" target="_blank" rel="noopener">&#9654; Watch tutorial</a>' +
            '</div>'
          );
        }).join("");
        return '<div class="guide-group"><div class="guide-group-title">' + esc(group.group) + '</div>' + rows + '</div>';
      }).join("");
    }
    return (
      '<div class="section-label">&#128218; Exercise Guide</div>' +
      '<button class="ghost-btn" data-action="toggleguide">' + toggleLabel + '</button>' +
      (state.guideOpen ? '<div class="card guide-wrap">' + body + '</div>' : '')
    );
  }

  function hydrationTabHtml() {
    var pct = Math.min(1, state.dayLog.waterMl / WATER_GOAL_ML);
    var r = 54, c = 2 * Math.PI * r;
    var offset = c - c * pct;
    return (
      '<div class="tab-pane">' +
        '<div class="section-label">&#128167; Hydration</div>' +
        '<div class="card" style="align-items:center">' +
          '<div class="plate-wrap">' +
            '<svg width="140" height="140" viewBox="0 0 140 140">' +
              '<circle cx="70" cy="70" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="10" />' +
              '<circle cx="70" cy="70" r="' + r + '" fill="none" stroke="var(--water)" stroke-width="10" stroke-dasharray="' + c + '" stroke-dashoffset="' + offset + '" stroke-linecap="round" transform="rotate(-90 70 70)" />' +
            '</svg>' +
            '<div class="plate-center"><div class="plate-value">' + (state.dayLog.waterMl / 1000).toFixed(1) + 'L</div><div class="plate-goal">of ' + (WATER_GOAL_ML / 1000).toFixed(1) + 'L</div></div>' +
          '</div>' +
          '<div class="quick-add-row">' +
            '<button class="quick-add-btn" data-action="addwater" data-ml="250">+250ml</button>' +
            '<button class="quick-add-btn" data-action="addwater" data-ml="500">+500ml</button>' +
            '<button class="quick-add-btn" data-action="addwater" data-ml="1000">+1000ml</button>' +
            '<button class="quick-add-ghost" data-action="addwater" data-ml="-250">&minus;250ml</button>' +
          '</div>' +
        '</div>' +
        '<div class="section-label">&#128293; Creatine</div>' +
        '<div class="card">' +
          '<button class="creatine-btn' + (state.dayLog.creatineTaken ? ' active' : '') + '" data-action="togglecreatine">' +
            '<span class="creatine-check">' + (state.dayLog.creatineTaken ? "&#10003;" : "") + '</span>' +
            (state.dayLog.creatineTaken ? "Creatine taken today" : "Mark creatine as taken") +
          '</button>' +
          '<div class="hint">3–5g, once daily — pair with breakfast for consistency.</div>' +
        '</div>' +
      '</div>'
    );
  }

  function mealsTabHtml() {
    var total = state.dayLog.meals.reduce(function (s, m) { return s + (Number(m.protein) || 0); }, 0);
    var rows = state.dayLog.meals.length === 0
      ? '<div class="empty-state">No meals logged yet today.</div>'
      : '<div class="plain-list">' + state.dayLog.meals.map(function (m) {
          return '<div class="row"><span class="row-name">' + esc(m.name) + '</span><span class="mono">' + m.protein + 'g</span><button class="icon-btn" data-action="delmeal" data-id="' + m.id + '">&#10005;</button></div>';
        }).join("") + '</div>';
    return (
      '<div class="tab-pane">' +
        '<div class="section-label">&#127869; Log a Meal</div>' +
        '<div class="card">' +
          '<div class="field-group"><span class="field-label">Meal</span><input class="text-input" id="meal-name" placeholder="e.g. Rice + 4 eggs" /></div>' +
          '<div class="field-group"><span class="field-label">Protein (g, estimate)</span><input class="text-input" id="meal-protein" type="number" min="0" placeholder="e.g. 24" /></div>' +
          '<button class="primary-btn" data-action="addmeal">+ Add Meal</button>' +
        '</div>' +
        '<div class="section-label">&#128293; Today\'s protein · ' + total + 'g</div>' +
        '<div class="card">' + rows + '</div>' +
      '</div>'
    );
  }

  function choresTabHtml() {
    var choresHtml;
    if (state.dayLog.chores.length === 0) {
      choresHtml = '<div class="empty-state">No chores added for today.</div><button class="ghost-btn" data-action="seedchores">Load usual chores (dog, plants, rice, errand)</button>';
    } else {
      choresHtml = '<div class="plain-list">' + state.dayLog.chores.map(function (c) {
        return (
          '<div class="chore-row">' +
            '<button class="chore-check-btn" data-action="togglechore" data-id="' + c.id + '">' +
              '<span class="chore-checkbox' + (c.done ? ' done' : '') + '">' + (c.done ? "&#10003;" : "") + '</span>' +
              '<span class="chore-text' + (c.done ? ' done' : '') + '">' + esc(c.text) + '</span>' +
            '</button>' +
            '<button class="icon-btn" data-action="delchore" data-id="' + c.id + '">&#10005;</button>' +
          '</div>'
        );
      }).join("") + '</div>';
    }
    var sleepChips = [5, 6, 7, 8, 9, 10].map(function (h) {
      return '<button class="sleep-chip' + (state.dayLog.sleepHours === h ? ' active' : '') + '" data-action="setsleep" data-h="' + h + '">' + h + 'h</button>';
    }).join("");
    return (
      '<div class="tab-pane">' +
        '<div class="section-label">&#9989; Chores</div>' +
        '<div class="card">' + choresHtml +
          '<div class="add-chore-row"><input class="text-input" id="new-chore" placeholder="Add a task…" /><button class="icon-add-btn" data-action="addchore">+</button></div>' +
        '</div>' +
        '<div class="section-label">&#127769; Sleep last night</div>' +
        '<div class="card"><div class="sleep-row">' + sleepChips + '</div></div>' +
      '</div>'
    );
  }

  var NAV_ICONS = {
    today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="8" cy="15" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="15" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="15" r="1" fill="currentColor" stroke="none"/></svg>',
    workout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M4 8l3-3M20 16l-3 3M2 10l2-2M22 14l-2 2"/><rect x="2.5" y="8.5" width="4" height="4" rx="1" transform="rotate(-45 4.5 10.5)"/><rect x="17.5" y="13.5" width="4" height="4" rx="1" transform="rotate(-45 19.5 15.5)"/></svg>',
    hydration: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5s7 8 7 13a7 7 0 1 1-14 0c0-5 7-13 7-13z"/></svg>',
    meals: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v7a2 2 0 0 1-2 2h0a2 2 0 0 1-2-2V3M5 12v9M12 3c1.5 0 2 2 2 4.5S13.5 12 12 12s-2-2-2-4.5S10.5 3 12 3zM12 12v9M19 3c-1.5 3-1.5 6 0 8v10"/></svg>',
    chores: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l2.5 2.5L16 9"/></svg>',
    schedule: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>',
  };

  function bottomNavHtml() {
    var items = [
      { id: "today", label: "Today" },
      { id: "workout", label: "Workout" },
      { id: "hydration", label: "Hydrate" },
      { id: "meals", label: "Meals" },
      { id: "chores", label: "Chores" },
      { id: "schedule", label: "Week" },
    ];
    return '<div class="bottom-nav"><div class="nav-dock">' + items.map(function (it) {
      return '<button class="nav-btn' + (state.tab === it.id ? ' active' : '') + '" data-action="settab" data-tab="' + it.id + '"><span class="nav-icon">' + NAV_ICONS[it.id] + '</span><span class="nav-label">' + it.label + '</span></button>';
    }).join("") + '</div></div>';
  }

  function render() {
    var body;
    if (state.tab === "today") body = todayTabHtml();
    else if (state.tab === "schedule") body = scheduleTabHtml();
    else if (state.tab === "workout") body = workoutTabHtml();
    else if (state.tab === "hydration") body = hydrationTabHtml();
    else if (state.tab === "meals") body = mealsTabHtml();
    else if (state.tab === "chores") body = choresTabHtml();

    document.getElementById("app").innerHTML =
      headerHtml() +
      '<div class="content">' + body + '</div>' +
      bottomNavHtml();

    attachHandlers();
    tickClock();
  }

  function attachHandlers() {
    var app = document.getElementById("app");

    app.querySelectorAll("[data-action]").forEach(function (el) {
      var action = el.getAttribute("data-action");
      if (el.tagName === "INPUT") return; // handled separately
      el.addEventListener("click", function () {
        handleAction(action, el);
      });
    });

    // schedule inputs
    app.querySelectorAll("[data-sched-idx]").forEach(function (el) {
      var evt = el.type === "checkbox" ? "change" : "change";
      el.addEventListener(evt, function () {
        var idx = Number(el.getAttribute("data-sched-idx"));
        var field = el.getAttribute("data-sched-field");
        var next = state.schedule.map(function (s, i) {
          if (i !== idx) return s;
          var copy = Object.assign({}, s);
          copy[field] = el.type === "checkbox" ? el.checked : el.value;
          return copy;
        });
        saveSchedule(next);
      });
    });

    // new chore enter key
    var newChoreInput = document.getElementById("new-chore");
    if (newChoreInput) {
      newChoreInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") handleAction("addchore");
      });
    }
  }

  function handleAction(action, el) {
    if (action === "prevday") {
      var d = new Date(state.dayKey + "T00:00:00"); d.setDate(d.getDate() - 1); goToDay(todayKey(d));
    } else if (action === "nextday") {
      var d2 = new Date(state.dayKey + "T00:00:00"); d2.setDate(d2.getDate() + 1); goToDay(todayKey(d2));
    } else if (action === "gotoday") {
      goToDay(todayKey());
    } else if (action === "settab") {
      setTab(el.getAttribute("data-tab"));
    } else if (action === "addwater") {
      var ml = Number(el.getAttribute("data-ml"));
      saveDayLog(Object.assign({}, state.dayLog, { waterMl: Math.max(0, state.dayLog.waterMl + ml) }));
    } else if (action === "togglecreatine") {
      saveDayLog(Object.assign({}, state.dayLog, { creatineTaken: !state.dayLog.creatineTaken }));
    } else if (action === "logprogram") {
      var exName = el.getAttribute("data-name");
      var sets = Number(el.getAttribute("data-sets")) || 0;
      var repsInput = document.getElementById(el.getAttribute("data-repsid"));
      var kgInput = document.getElementById(el.getAttribute("data-kgid"));
      var reps = Number(repsInput.value) || 0;
      var kg = Math.max(MIN_KG, Number(kgInput.value) || MIN_KG);
      var entry = { id: String(Date.now()), date: state.dayKey, exercise: exName, sets: sets, reps: reps, weight: kg };
      saveWorkoutLog([entry].concat(state.workoutLog));
      saveProgress(exName, kg, reps);
    } else if (action === "delworkout") {
      var id = el.getAttribute("data-id");
      saveWorkoutLog(state.workoutLog.filter(function (w) { return w.id !== id; }));
    } else if (action === "addmeal") {
      var mname = document.getElementById("meal-name").value.trim();
      if (!mname) return;
      var protein = Number(document.getElementById("meal-protein").value) || 0;
      var meal = { id: String(Date.now()), name: mname, protein: protein };
      saveDayLog(Object.assign({}, state.dayLog, { meals: [meal].concat(state.dayLog.meals) }));
    } else if (action === "delmeal") {
      var mid = el.getAttribute("data-id");
      saveDayLog(Object.assign({}, state.dayLog, { meals: state.dayLog.meals.filter(function (m) { return m.id !== mid; }) }));
    } else if (action === "seedchores") {
      var chores = DEFAULT_CHORES.map(function (c, i) { return { id: "seed-" + i, text: c, done: false }; });
      saveDayLog(Object.assign({}, state.dayLog, { chores: chores }));
    } else if (action === "togglechore") {
      var cid = el.getAttribute("data-id");
      var chores2 = state.dayLog.chores.map(function (c) { return c.id === cid ? Object.assign({}, c, { done: !c.done }) : c; });
      saveDayLog(Object.assign({}, state.dayLog, { chores: chores2 }));
    } else if (action === "delchore") {
      var did = el.getAttribute("data-id");
      saveDayLog(Object.assign({}, state.dayLog, { chores: state.dayLog.chores.filter(function (c) { return c.id !== did; }) }));
    } else if (action === "addchore") {
      var input = document.getElementById("new-chore");
      var t = input.value.trim();
      if (!t) return;
      var newChore = { id: String(Date.now()), text: t, done: false };
      saveDayLog(Object.assign({}, state.dayLog, { chores: state.dayLog.chores.concat([newChore]) }));
    } else if (action === "setsleep") {
      var h = Number(el.getAttribute("data-h"));
      saveDayLog(Object.assign({}, state.dayLog, { sleepHours: h }));
    } else if (action === "toggleguide") {
      state.guideOpen = !state.guideOpen;
      render();
    }
  }

  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js").catch(function (e) { console.warn("SW register failed", e); });
    });
  }
})();
</script>
</body>
</html>
