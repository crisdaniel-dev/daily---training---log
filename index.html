<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Training Log</title>
<meta name="theme-color" content="#12151a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Training Log" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<style>
:root {
  --bg: #12151a; --surface: #1b2028; --surface2: #232a33; --line: #2c3440;
  --text: #ecebe4; --muted: #8b95a3; --accent: #ff5330; --accent2: #f2b93c;
  --water: #4fb8c9; --good: #5fbf82;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body {
  background-image:
    linear-gradient(rgba(255,83,48,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,83,48,0.035) 1px, transparent 1px);
  background-size: 28px 28px;
  background-attachment: fixed;
}
@keyframes fadeSlideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.tab-pane { animation: fadeSlideUp 0.35s cubic-bezier(0.16,1,0.3,1); }
.tab-pane .card, .tab-pane .schedule-card, .tab-pane .guide-item { animation: fadeIn 0.5s ease both; }
.tab-pane .row, .tab-pane .program-item, .tab-pane .chore-row { animation: fadeSlideUp 0.4s cubic-bezier(0.16,1,0.3,1) both; }
.tab-pane .row:nth-child(1), .tab-pane .program-item:nth-child(1), .tab-pane .chore-row:nth-child(1) { animation-delay: 0.02s; }
.tab-pane .row:nth-child(2), .tab-pane .program-item:nth-child(2), .tab-pane .chore-row:nth-child(2) { animation-delay: 0.06s; }
.tab-pane .row:nth-child(3), .tab-pane .program-item:nth-child(3), .tab-pane .chore-row:nth-child(3) { animation-delay: 0.10s; }
.tab-pane .row:nth-child(4), .tab-pane .program-item:nth-child(4), .tab-pane .chore-row:nth-child(4) { animation-delay: 0.14s; }
.tab-pane .row:nth-child(5), .tab-pane .program-item:nth-child(5), .tab-pane .chore-row:nth-child(5) { animation-delay: 0.18s; }
.tab-pane .row:nth-child(n+6), .tab-pane .program-item:nth-child(n+6), .tab-pane .chore-row:nth-child(n+6) { animation-delay: 0.22s; }
input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

.header { padding: 18px 18px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
.header-top { display: flex; align-items: center; justify-content: space-between; }
.brand { font-size: 19px; font-weight: 800; letter-spacing: 0.06em; display: flex; align-items: center; gap: 6px; }
.brand-mark { color: var(--accent); font-size: 12px; }
.date-nav { display: flex; align-items: center; gap: 0; background: linear-gradient(180deg, rgba(255,83,48,0.08), rgba(255,83,48,0.02)); border: 1px solid rgba(255,83,48,0.35); border-radius: 10px; padding: 4px; position: relative; overflow: hidden; }
.date-nav::before { content: ""; position: absolute; top: 0; left: -40%; width: 30%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,83,48,0.15), transparent); animation: scan 3.5s ease-in-out infinite; }
@keyframes scan { 0% { left: -40%; } 100% { left: 110%; } }
.date-nav button.arrow { background: rgba(255,83,48,0.08); border: 1px solid transparent; color: var(--accent); font-size: 18px; width: 28px; height: 28px; border-radius: 7px; position: relative; z-index: 1; transition: background 0.15s, transform 0.1s; display: flex; align-items: center; justify-content: center; }
.date-nav button.arrow:active { transform: scale(0.88); background: rgba(255,83,48,0.25); }
.date-nav button.label { position: relative; z-index: 1; background: none; border: none; color: var(--accent); font-size: 11.5px; letter-spacing: 0.12em; font-family: 'Courier New', monospace; font-weight: 700; padding: 4px 10px; text-shadow: 0 0 8px rgba(255,83,48,0.55); }
.date-nav button.label::before { content: "["; opacity: 0.5; margin-right: 3px; }
.date-nav button.label::after { content: "]"; opacity: 0.5; margin-left: 3px; }
.live-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--good); margin-right: 6px; box-shadow: 0 0 6px var(--good); animation: pulse-dot 1.6s ease-in-out infinite; }
@keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.7); } }
.header-sub { margin-top: 6px; font-size: 12px; color: var(--muted); }
.live-clock { margin-top: 8px; font-family: 'Courier New', monospace; font-size: 12px; letter-spacing: 0.04em; color: var(--water); text-shadow: 0 0 8px rgba(79,184,201,0.5); display: inline-block; }

.content { flex: 1; padding: 16px 16px 104px; overflow-y: auto; }
.tab-pane { display: flex; flex-direction: column; gap: 8px; }

.section-label { display: flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 14px; margin-bottom: 2px; }

.card { background: linear-gradient(160deg, var(--surface), rgba(27,32,40,0.7)); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 8px 20px -12px rgba(0,0,0,0.6); position: relative; transition: border-color 0.2s, box-shadow 0.2s; }
.card:active { border-color: rgba(255,83,48,0.4); }
.card-row { display: flex; gap: 10px; }

.stat-block { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.stat-label { font-size: 10px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
.stat-value { font-size: 24px; font-weight: 800; transition: text-shadow 0.3s; }
.stat-value.accent { color: var(--accent); text-shadow: 0 0 14px rgba(255,83,48,0.5); }
.stat-sub { font-size: 11px; color: var(--muted); }

.plain-list { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--surface2); border-radius: 10px; }
.row-name { flex: 1; font-size: 13.5px; font-weight: 500; }
.row-date { font-size: 10px; color: var(--muted); font-family: monospace; width: 32px; }
.mono { font-family: monospace; font-size: 12.5px; color: var(--accent2); }
.icon-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; font-size: 15px; }

.empty-state { font-size: 13px; color: var(--muted); padding: 10px 2px; }

.field-group { display: flex; flex-direction: column; gap: 5px; }
.field-label { font-size: 10.5px; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; }
.text-input, .note-input {
  background: var(--surface2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px;
  color: var(--text); font-size: 14px; outline: none; width: 100%; font-family: inherit;
}
.num-field { flex: 1; display: flex; flex-direction: column; gap: 5px; }
.num-input { background: var(--surface2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 8px; color: var(--text); font-size: 14px; font-family: monospace; outline: none; width: 100%; text-align: center; }

.primary-btn { background: linear-gradient(135deg, var(--accent), #ff7a4d); border: none; border-radius: 10px; color: #1a0d08; font-weight: 800; font-size: 14px; padding: 11px 14px; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; width: 100%; position: relative; overflow: hidden; box-shadow: 0 4px 16px -4px rgba(255,83,48,0.5); transition: transform 0.1s; }
.primary-btn::after { content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(115deg, transparent, rgba(255,255,255,0.35), transparent); transform: skewX(-20deg); animation: btn-shine 2.8s ease-in-out infinite; }
@keyframes btn-shine { 0% { left: -60%; } 40%, 100% { left: 130%; } }
.primary-btn:active { transform: scale(0.97); }
.log-btn { background: linear-gradient(135deg, var(--accent), #ff7a4d); border: none; border-radius: 9px; color: #1a0d08; font-weight: 800; font-size: 13px; padding: 9px 14px; cursor: pointer; white-space: nowrap; box-shadow: 0 3px 12px -3px rgba(255,83,48,0.5); transition: transform 0.1s; }
.log-btn:active { transform: scale(0.94); }
.ghost-btn { background: none; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: 12.5px; padding: 10px 12px; cursor: pointer; margin-top: 6px; width: 100%; transition: border-color 0.2s, color 0.2s; }
.ghost-btn:active { border-color: var(--accent); color: var(--accent2); }

.schedule-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.schedule-top { display: flex; align-items: center; gap: 14px; }
.schedule-day { font-size: 15px; font-weight: 700; letter-spacing: 0.03em; flex: 1; }
.toggle-label { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
.toggle-label input { width: 15px; height: 15px; accent-color: var(--accent); }

.plate-wrap { position: relative; width: 140px; height: 140px; align-self: center; }
.plate-wrap svg circle:nth-child(2) { filter: drop-shadow(0 0 6px var(--water)); }
.plate-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.plate-value { font-size: 30px; font-weight: 800; text-shadow: 0 0 16px rgba(79,184,201,0.6); }
.plate-goal { font-size: 11px; color: var(--muted); margin-top: 2px; }
.quick-add-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.quick-add-btn { background: linear-gradient(135deg, var(--water), #3a8fa0); border: none; border-radius: 9px; color: #062229; font-weight: 800; font-size: 12.5px; padding: 9px 12px; cursor: pointer; box-shadow: 0 3px 12px -3px rgba(79,184,201,0.5); transition: transform 0.1s; }
.quick-add-btn:active { transform: scale(0.93); }
.quick-add-ghost { background: none; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); font-size: 12.5px; padding: 9px 12px; cursor: pointer; }

.creatine-btn { display: flex; align-items: center; gap: 10px; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; color: var(--text); font-size: 14px; font-weight: 500; cursor: pointer; width: 100%; transition: transform 0.15s, background 0.2s, border-color 0.2s; }
.creatine-btn.active { background: rgba(95,191,130,0.14); border-color: var(--good); color: var(--good); box-shadow: 0 0 20px -6px rgba(95,191,130,0.5); animation: pop 0.3s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.03); } 100% { transform: scale(1); } }
.creatine-check { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid currentColor; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px; }
.hint { font-size: 11.5px; color: var(--muted); margin-top: 8px; }

.chore-row { display: flex; align-items: center; gap: 8px; }
.chore-check-btn { flex: 1; display: flex; align-items: center; gap: 10px; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; text-align: left; transition: border-color 0.2s; }
.chore-checkbox { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--muted); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11px; transition: transform 0.2s, background 0.2s; }
.chore-checkbox.done { background: var(--good); border-color: var(--good); color: #0a1a10; box-shadow: 0 0 10px -1px rgba(95,191,130,0.7); animation: pop 0.3s cubic-bezier(0.34,1.56,0.64,1); }
.chore-text.done { color: var(--muted); text-decoration: line-through; }
.add-chore-row { display: flex; gap: 8px; margin-top: 4px; }
.icon-add-btn { background: var(--accent); border: none; color: #1a0d08; cursor: pointer; border-radius: 10px; width: 40px; font-size: 18px; }

.program-header { display: flex; justify-content: center; margin-top: 4px; }
.program-badge { font-size: 13px; font-weight: 800; letter-spacing: 0.05em; padding: 8px 16px; border-radius: 999px; text-transform: uppercase; position: relative; overflow: hidden; animation: fadeIn 0.4s ease; }
.badge-upper { background: rgba(79,184,201,0.15); color: var(--water); border: 1px solid var(--water); box-shadow: 0 0 18px -4px rgba(79,184,201,0.5); }
.badge-lower { background: rgba(95,191,130,0.15); color: var(--good); border: 1px solid var(--good); box-shadow: 0 0 18px -4px rgba(95,191,130,0.5); }
.badge-rest { background: rgba(139,149,163,0.15); color: var(--muted); border: 1px solid var(--muted); }
.badge-optional { background: rgba(242,185,60,0.15); color: var(--accent2); border: 1px solid var(--accent2); box-shadow: 0 0 18px -4px rgba(242,185,60,0.5); }
.program-card { gap: 10px; }
.program-item { background: var(--surface2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.program-item.done { opacity: 0.6; }
.program-item-top { display: flex; justify-content: space-between; align-items: center; }
.program-item-name { font-size: 14px; font-weight: 700; }
.program-item-target { font-size: 12px; color: var(--muted); font-family: monospace; }
.program-item-inputs { display: flex; gap: 8px; align-items: flex-end; }
.log-btn { background: var(--accent); border: none; border-radius: 9px; color: #1a0d08; font-weight: 700; font-size: 13px; padding: 9px 14px; cursor: pointer; white-space: nowrap; }

.guide-wrap { gap: 16px; }
.guide-group-title { font-size: 12px; font-weight: 800; letter-spacing: 0.05em; color: var(--accent2); text-transform: uppercase; margin-bottom: 8px; }
.guide-group + .guide-group { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.guide-item { background: var(--surface2); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.guide-name { font-size: 13.5px; font-weight: 700; margin-bottom: 4px; }
.guide-row { font-size: 12px; color: var(--muted); line-height: 1.5; }
.guide-label { color: var(--text); font-weight: 600; }
.guide-link { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 12px; color: var(--water); text-decoration: none; font-weight: 600; }

.sleep-row { display: flex; gap: 8px; flex-wrap: wrap; }
.sleep-chip { background: var(--surface2); border: 1px solid var(--line); border-radius: 9px; color: var(--text); font-size: 13px; font-family: monospace; padding: 9px 14px; cursor: pointer; }
.sleep-chip.active { background: var(--accent2); border-color: var(--accent2); color: #241a04; font-weight: 700; }

.bottom-nav { position: sticky; bottom: 0; padding: 10px 12px 16px; background: linear-gradient(180deg, transparent, var(--bg) 30%); }
.nav-dock {
  display: flex; justify-content: space-around; align-items: center;
  background: linear-gradient(160deg, rgba(35,42,51,0.9), rgba(27,32,40,0.85));
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 20px; padding: 8px 6px;
  box-shadow: 0 -1px 0 rgba(255,255,255,0.04) inset, 0 12px 30px -10px rgba(0,0,0,0.65);
}
.nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 7px 10px; color: var(--muted); position: relative; transition: color 0.25s, transform 0.15s; border-radius: 12px; flex: 1; }
.nav-btn:active { transform: scale(0.92); }
.nav-btn.active { color: var(--accent); background: rgba(255,83,48,0.1); }
.nav-btn.active::before { content: ""; position: absolute; top: 1px; left: 50%; transform: translateX(-50%); width: 16px; height: 2.5px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 8px 1px rgba(255,83,48,0.8); }
.nav-icon { width: 20px; height: 20px; display: flex; transition: filter 0.25s, transform 0.2s; }
.nav-icon svg { width: 100%; height: 100%; }
.nav-btn.active .nav-icon { filter: drop-shadow(0 0 5px rgba(255,83,48,0.65)); transform: translateY(-1px); }
.nav-label { font-size: 9.5px; letter-spacing: 0.02em; font-weight: 600; }

input, textarea, button { font-family: inherit; }
</style>
</head>
